# 99乘法乐园 · 自动部署
# 触发: push 到 main 分支
# 流程: checkout → 注入版本指纹 → tar 打包 → scp 上传 → 服务器解压原子切换 → nginx reload
# 打包传输: 音频资源多（500+ 小文件），单流传输远快于 rsync 逐文件协商
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

# 同一时间只跑一个部署, 避免并发覆盖
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 首次推送大体积资源（如 audio/ 配音目录）时 rsync 需要更长时间
    timeout-minutes: 15

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔖 注入版本指纹
        # 给 index.html 里 css/js 引用加 ?v=<commit>, 实现长期缓存 + 即时更新
        # 用 node 而非 sed: 正则更可靠, 避免 sed 分隔符/转义问题
        run: |
          node -e "
            const fs = require('fs');
            let html = fs.readFileSync('index.html', 'utf8');
            const SHA = '${GITHUB_SHA::7}';
            html = html.replace(/((?:href|src)=[\"'])([^\"']*?\.(?:css|js))(?:\?[^\"']*)?([\"'])/g, (m, p1, p2, p3) => p1 + p2 + '?v=' + SHA + p3);
            fs.writeFileSync('index.html', html);
            console.log('本次部署版本: ' + SHA);
          "
          echo "=== 指纹注入结果预览 ==="
          grep -oE '(href|src)="[^"]*\.(css|js)[^"]*"' index.html

      - name: 🔎 校验部署配置
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST" || { echo "SSH_HOST Secret 未配置"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER Secret 未配置"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY Secret 未配置"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "SSH_KNOWN_HOSTS Secret 未配置"; exit 1; }

      - name: 🔑 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "SSH_KEY_FILE=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"

      - name: 📦 打包站点
        # 打成单个 tar.gz 再传输：高延迟链路上 rsync 逐文件协商极慢
        # （audio/ 有 500+ 个小 mp3），单文件流传输快一个数量级。
        # mp3 已是有损压缩，gzip 收益主要在 html/css/js 与文件合并本身。
        run: |
          tar -czf /tmp/site.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./deploy_keys' \
            --exclude='./.zcode' \
            --exclude='./.agents' \
            --exclude='./.claude' \
            --exclude='./.DS_Store' \
            ./
          ls -lh /tmp/site.tar.gz

      - name: 📤 上传并原子切换
        # 解压到临时目录后整体 mv 替换（同分区原子操作）：
        # 1) 部署过程站点不会出现新旧文件混杂
        # 2) 目录替换天然等价于 rsync --delete 的清理效果
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i "$SSH_KEY_FILE" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/site.tar.gz "$SSH_USER@$SSH_HOST:/tmp/99chengfa-site.tar.gz"
          ssh -i "$SSH_KEY_FILE" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" '
              set -e
              rm -rf /data/99chengfa.next
              mkdir -p /data/99chengfa.next
              tar -xzf /tmp/99chengfa-site.tar.gz -C /data/99chengfa.next
              if [ -d /data/99chengfa ]; then mv /data/99chengfa /data/99chengfa.old; fi
              mv /data/99chengfa.next /data/99chengfa
              rm -rf /data/99chengfa.old /tmp/99chengfa-site.tar.gz
              echo "✅ 站点目录已原子切换"
            '

      - name: 🔄 重载 nginx
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i "$SSH_KEY_FILE" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'sudo /usr/sbin/nginx -t && sudo /usr/bin/systemctl reload nginx && echo "✅ nginx reload 成功"'

      - name: ✅ 验证部署
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://99.youyongai.com")
          MANIFEST=$(curl -s -o /dev/null -w "%{http_code}" "https://99.youyongai.com/audio/manifest.json")
          CLIP=$(curl -s -o /dev/null -w "%{http_code}" "https://99.youyongai.com/audio/mk_3x4.mp3")
          echo "首页: $CODE | 音频清单: $MANIFEST | 抽检音频: $CLIP"
          if [ "$CODE" = "200" ] && [ "$MANIFEST" = "200" ] && [ "$CLIP" = "200" ]; then
            echo "✅ 部署成功，站点与音频资源均可访问"
          else
            echo "❌ 部署验证失败"
            exit 1
          fi

      - name: 🧹 清理临时 SSH 凭据
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
