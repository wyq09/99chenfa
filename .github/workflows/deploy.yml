# 99乘法乐园 · 自动部署
# 触发: push 到 main 分支
# 流程: checkout → 注入版本指纹 → rsync 推送 → nginx reload
# 纯静态无构建, 约 30 秒完成
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

# 同一时间只跑一个部署, 避免并发覆盖
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 首次推送大体积资源（如 audio/ 配音目录）时 rsync 需要更长时间
    timeout-minutes: 15

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔖 注入版本指纹
        # 给 index.html 里 css/js 引用加 ?v=<commit>, 实现长期缓存 + 即时更新
        # 用 node 而非 sed: 正则更可靠, 避免 sed 分隔符/转义问题
        run: |
          node -e "
            const fs = require('fs');
            let html = fs.readFileSync('index.html', 'utf8');
            const SHA = '${GITHUB_SHA::7}';
            html = html.replace(/((?:href|src)=[\"'])([^\"']*?\.(?:css|js))(?:\?[^\"']*)?([\"'])/g, (m, p1, p2, p3) => p1 + p2 + '?v=' + SHA + p3);
            fs.writeFileSync('index.html', html);
            console.log('本次部署版本: ' + SHA);
          "
          echo "=== 指纹注入结果预览 ==="
          grep -oE '(href|src)="[^"]*\.(css|js)[^"]*"' index.html

      - name: 🔎 校验部署配置
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST" || { echo "SSH_HOST Secret 未配置"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER Secret 未配置"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY Secret 未配置"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "SSH_KNOWN_HOSTS Secret 未配置"; exit 1; }

      - name: 🔑 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "SSH_KEY_FILE=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"

      - name: 📤 推送静态文件到服务器
        # --delete 保证服务器无残留旧文件; 排除敏感目录
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz --delete \
            --exclude='deploy_keys' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.zcode' \
            --exclude='.DS_Store' \
            -e "ssh -i $SSH_KEY_FILE -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ \
            "$SSH_USER@$SSH_HOST:/data/99chengfa/"

      - name: 🔄 重载 nginx
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i "$SSH_KEY_FILE" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'sudo /usr/sbin/nginx -t && sudo /usr/bin/systemctl reload nginx && echo "✅ nginx reload 成功"'

      - name: ✅ 验证部署
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://99.youyongai.com")
          echo "HTTP 状态码: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ 部署成功，站点可访问"
          else
            echo "❌ 部署验证失败"
            exit 1
          fi

      - name: 🧹 清理临时 SSH 凭据
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
